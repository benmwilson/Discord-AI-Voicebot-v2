<!-- Penguin UI Navbar - Shared Component -->
<nav x-data="{ mobileMenuIsOpen: false }" x-on:click.away="mobileMenuIsOpen = false" class="bg-white shadow-sm border-b border-gray-200" aria-label="Miku Bot Dashboard menu">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4">
            <!-- Brand Logo -->
            <a href="/" class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <span class="text-white text-xl">🤖</span>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Miku Bot</h1>
                    <p class="text-sm text-gray-500">Dashboard</p>
                </div>
            </a>
            
            <!-- Desktop Menu -->
            <ul class="hidden md:flex items-center space-x-8">
                <li><a href="/" class="text-gray-700 hover:text-purple-600 transition-colors font-medium" :class="$el.href === window.location.href ? 'text-purple-600' : ''">Dashboard</a></li>
                <li><a href="/enhanced" class="text-gray-700 hover:text-purple-600 transition-colors font-medium" :class="$el.href === window.location.href ? 'text-purple-600' : ''">🎨 Enhanced</a></li>
                <li><a href="/memory" class="text-gray-700 hover:text-purple-600 transition-colors font-medium" :class="$el.href === window.location.href ? 'text-purple-600' : ''">🧠 Memory</a></li>
                <li><a href="#" class="text-gray-700 hover:text-purple-600 transition-colors font-medium">📊 Analytics</a></li>
                <li><a href="#" class="text-gray-700 hover:text-purple-600 transition-colors font-medium">⚙️ Settings</a></li>
                
                <!-- Status Indicator -->
                <li class="flex items-center space-x-2">
                    <div class="w-3 h-3 rounded-full" :class="botStatus && botStatus.online ? 'bg-green-500' : 'bg-red-500'" id="statusIndicator"></div>
                    <span class="text-sm font-medium" :text="botStatus && botStatus.online ? 'Online' : 'Offline'" id="statusText">Offline</span>
                </li>
                
                <!-- Last Updated -->
                <li class="text-sm text-gray-500" id="lastUpdated">Last updated: Never</li>
            </ul>
            
            <!-- Mobile Menu Button -->
            <button x-on:click="mobileMenuIsOpen = !mobileMenuIsOpen" 
                    x-bind:aria-expanded="mobileMenuIsOpen" 
                    x-bind:class="mobileMenuIsOpen ? 'fixed top-6 right-6 z-20' : null" 
                    type="button" 
                    class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors" 
                    aria-label="mobile menu" 
                    aria-controls="mobileMenu">
                <svg x-cloak x-show="!mobileMenuIsOpen" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
                <svg x-cloak x-show="mobileMenuIsOpen" xmlns="http://www.w3.org/2000/svg" fill="none" aria-hidden="true" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        
        <!-- Mobile Menu -->
        <ul x-cloak 
            x-show="mobileMenuIsOpen" 
            x-transition:enter="transition motion-reduce:transition-none ease-out duration-300" 
            x-transition:enter-start="-translate-y-full" 
            x-transition:enter-end="translate-y-0" 
            x-transition:leave="transition motion-reduce:transition-none ease-out duration-300" 
            x-transition:leave-start="translate-y-0" 
            x-transition:leave-end="-translate-y-full" 
            id="mobileMenu" 
            class="md:hidden bg-white border-t border-gray-200 py-4 space-y-2">
            <li class="px-4 py-2">
                <a href="/" class="block text-gray-700 hover:text-purple-600 transition-colors font-medium" :class="$el.href === window.location.href ? 'text-purple-600' : ''">Dashboard</a>
            </li>
            <li class="px-4 py-2">
                <a href="/enhanced" class="block text-gray-700 hover:text-purple-600 transition-colors font-medium" :class="$el.href === window.location.href ? 'text-purple-600' : ''">🎨 Enhanced</a>
            </li>
            <li class="px-4 py-2">
                <a href="/memory" class="block text-gray-700 hover:text-purple-600 transition-colors font-medium" :class="$el.href === window.location.href ? 'text-purple-600' : ''">🧠 Memory</a>
            </li>
            <li class="px-4 py-2">
                <a href="#" class="block text-gray-700 hover:text-purple-600 transition-colors font-medium">📊 Analytics</a>
            </li>
            <li class="px-4 py-2">
                <a href="#" class="block text-gray-700 hover:text-purple-600 transition-colors font-medium">⚙️ Settings</a>
            </li>
            <hr class="my-2 border-gray-200">
            <li class="px-4 py-2 flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full" :class="botStatus && botStatus.online ? 'bg-green-500' : 'bg-red-500'" id="statusIndicatorMobile"></div>
                <span class="text-sm font-medium" :text="botStatus && botStatus.online ? 'Online' : 'Offline'" id="statusTextMobile">Offline</span>
            </li>
            <li class="px-4 py-2 text-sm text-gray-500" id="lastUpdatedMobile">Last updated: Never</li>
        </ul>
    </div>
</nav>
